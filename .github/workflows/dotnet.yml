# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "feature/big-commit" ]
  pull_request:
    branches: [ "feature/big-commit" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # Install NuGet (required for packages.config)
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      # Restore legacy packages.config dependencies
      - name: NuGet restore
        run: nuget restore "Ultrapower Community.sln"

      # Build ONLY the server (not the whole solution)
      - name: Build server
        run: >
          msbuild
          "Ultrapowa Clash Server/Ultrapower Clash Server.csproj"
          /p:Configuration=Release
          /p:Platform="Any CPU"

      # Upload the EXE
      - name: Upload server exe
        uses: actions/upload-artifact@v4
        with:
          name: Ultrapower-Clash-Server
          path: |
            Ultrapowa Clash Server/bin/Release/*.exe
