# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "feature/big-commit" ]
  pull_request:
    branches: [ "feature/big-commit" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: NuGet restore
        run: nuget restore "Ultrapower Community.sln"
      
      - name: Build server
        run: |
          & "C:\Program Files\Microsoft Visual Studio\2022\BuildTools\MSBuild\Current\Bin\MSBuild.exe" `
            "Ultrapowa Clash Server\Ultrapower Clash Server.csproj" `
            /p:Configuration=Release `
            /p:Platform="Any CPU"
      
      - name: Upload server exe
        uses: actions/upload-artifact@v4
        with:
          name: Ultrapower-Clash-Server
          path: Ultrapowa Clash Server/bin/Release/*.exe
