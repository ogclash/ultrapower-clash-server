# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "feature/big-commit" ]
  pull_request:
    branches: [ "feature/big-commit" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'  # or match the .NET version in the repo

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build "Ultrapower Community.sln" --configuration Release --no-restore

      - name: Publish EXE
        run: dotnet publish "Ultrapower Community.sln" -c Release -r win-x64 --self-contained false --no-build

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ultrapower-Windows-Exe
          path: |
            **/bin/Release/**/win-x64/publish/*.exe
